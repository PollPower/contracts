name: gitleaks
# G10: secret scan of the full history on every push and pull request.
# Pinned gitleaks release, verified by checksum (no third-party action).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          f=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: scan history
        run: ./gitleaks git --redact --no-banner --log-opts="--all" .
