# WI-16 local devnet (ledger 9): the whole-stack test bed before any public
# deploy. Derived from midnightntwrk/midnight-local-dev standalone.yml, moved
# to the ledger 9 set (node 2.1.101, indexer 4.4.101, proof server 9.0.2).
#
# Runs on kenya beside Joi's Preprod stack, so it uses its own project name,
# offset ports and volumes, bound to 127.0.0.1 only. Reach it from throne with
#   ssh -N -L 19944:127.0.0.1:19944 -L 18088:127.0.0.1:18088 -L 16300:127.0.0.1:16300 kenya
# then MIDNIGHT_NETWORK_ID=undeployed MIDNIGHT_NODE_URL=http://127.0.0.1:19944
#      MIDNIGHT_INDEXER_URL=http://127.0.0.1:18088/api/v4/graphql
#      MIDNIGHT_PROOF_SERVER_URL=http://127.0.0.1:16300
#
# Start:  docker compose -p wi16-devnet -f compose.yml up -d
# Stop:   docker compose -p wi16-devnet -f compose.yml down        (keeps no chain data: dev chain)
name: wi16-devnet

services:
  proof-server:
    container_name: 'wi16-proof-server'
    image: 'midnightntwrk/proof-server:9.0.2'
    command: ['midnight-proof-server', '-v']
    ports:
      - '127.0.0.1:16300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    volumes:
      - wi16-zk-params:/var/cache/midnight/zk-params
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  indexer:
    container_name: 'wi16-indexer'
    image: 'midnightntwrk/indexer-standalone:4.4.101'
    ports:
      - '127.0.0.1:18088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      # Dev-only placeholder from the official standalone.yml (local chain, no real data).
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'e2e-test-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    container_name: 'wi16-node'
    image: 'midnightntwrk/midnight-node:2.1.101'
    ports:
      - '127.0.0.1:19944:9944'
    healthcheck:
      # Gate on block #1 existing (see the official standalone.yml for why).
      test:
        [
          'CMD-SHELL',
          'curl -sf -X POST -H "Content-Type: application/json" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"chain_getBlockHash\",\"params\":[1]}" http://localhost:9944 | grep -q "\"result\":\"0x"',
        ]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'

volumes:
  wi16-zk-params:
