# gitleaks configuration (G10). Default rules, plus narrow allowlists for
# known non-secrets. Run: gitleaks git --redact . (history) and the pre-commit
# hook (staged changes). CI: .github/workflows/gitleaks.yml.
title = "PollPower contracts"

[extend]
useDefault = true

[[allowlists]]
description = "Devnet pass records: sha256 file hashes of the deploy code in the manifest (not secrets)"
condition = "AND"
paths = ['''^docs/devnet-passes/[^/]+\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9_./-]+": "[0-9a-f]{64}",?\s*$''']
